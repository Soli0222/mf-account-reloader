name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.repository }}
  queue: max

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: Soli0222/shared-workflows/.github/workflows/release-pipeline.yaml@v1.3.0
    secrets: inherit
