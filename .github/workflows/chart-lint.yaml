name: Chart lint
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 scripts/check-chart.py
      - run: python3 scripts/test-workflows.py
